name: build-windows

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Unit tests
        run: |
          cd flow-go
          go test ./... -count=1

      - name: Cross-compile flow-windows.exe
        run: |
          cd flow-go
          GOOS=windows GOARCH=amd64 go build -trimpath -o flow-windows.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: flow-windows
          path: flow-go/flow-windows.exe
          if-no-files-found: error