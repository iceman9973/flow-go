<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Flow Go Bridge</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; padding: 14px 16px; width: 286px;
      font: 13px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    h1 { margin: 0 0 10px; font-size: 14px; font-weight: 600; }
    dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; }
    dt { opacity: 0.6; }
    dd { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ok { color: #1a7f37; }
    .off { color: #b42318; }
    p { margin: 12px 0 0; opacity: 0.6; font-size: 12px; }

    hr { margin: 14px 0 12px; border: 0; border-top: 1px solid rgba(128,128,128,0.28); }
    label { display: block; font-size: 12px; opacity: 0.6; margin-bottom: 5px; }
    .row { display: flex; gap: 6px; }
    input {
      flex: 1; min-width: 0; padding: 5px 7px; font: inherit; font-size: 12px;
      border: 1px solid rgba(128,128,128,0.4); border-radius: 5px; background: transparent;
      color: inherit;
    }
    button {
      padding: 5px 10px; font: inherit; font-size: 12px; cursor: pointer;
      border: 1px solid rgba(128,128,128,0.4); border-radius: 5px;
      background: rgba(128,128,128,0.14); color: inherit;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    #result { margin: 7px 0 0; font-size: 12px; min-height: 1.2em; }
    #result.ok { color: #1a7f37; opacity: 1; }
    #result.off { color: #b42318; opacity: 1; }
  </style>
</head>
<body>
  <h1>Flow Go Bridge</h1>
  <dl>
    <dt>Backend</dt><dd id="daemon">checking…</dd>
    <dt>Tab</dt><dd id="tab">none</dd>
    <dt>Captchas</dt><dd id="mints">0</dd>
    <dt>Upscales</dt><dd id="upscales">0</dd>
    <dt>Last op</dt><dd id="lastOp">—</dd>
  </dl>

  <hr>

  <!--
    The bridge token, for the one case that needs a human: an extension that has
    lost its stored token cannot connect and cannot be told anything by the
    backend, because the backend refuses the connection first. Reinstalling is
    what usually causes it — that clears chrome.storage.local — and pasting the
    token here fixes it without deleting files or restarting anything.
  -->
  <form id="tokenForm">
    <label for="token">Bridge token <span id="tokenState">(unknown)</span></label>
    <div class="row">
      <input id="token" type="password" placeholder="paste the token" autocomplete="off" spellcheck="false">
      <button id="save" type="submit">Save</button>
    </div>
  </form>
  <p id="result"></p>

  <p>Supplies cookies, identity, reCAPTCHA tokens and the in-page upscale. No debugger access.</p>
  <script src="popup.js"></script>
</body>
</html>
